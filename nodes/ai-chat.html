<script type="text/javascript">
  (function () {
    if (window.__nrafbSidebarRegistered) return;
    window.__nrafbSidebarRegistered = true;

    // Load CSS
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "ai-flow-builder/static/ai-chat.css";
    document.head.appendChild(css);

    // Sidebar container
    const $content = $(`
      <div class="nrafb-root">
        <div class="nrafb-toolbar">
          <button class="nrafb-btn nrafb-new" title="New chat"><i class="fa fa-plus"></i></button>
          <select class="nrafb-conversations"><option value="">— conversations —</option></select>
          <button class="nrafb-btn nrafb-delete" title="Delete chat"><i class="fa fa-trash"></i></button>
          <button class="nrafb-btn nrafb-export" title="Export chat"><i class="fa fa-download"></i></button>
          <button class="nrafb-btn nrafb-cleanup" title="Clean up old chats"><i class="fa fa-broom"></i></button>
          <button class="nrafb-btn nrafb-restore" title="Restore last AI backup"><i class="fa fa-undo"></i></button>
          <button class="nrafb-btn nrafb-audit" title="Show AI audit log"><i class="fa fa-list-alt"></i></button>
          <span class="nrafb-spacer"></span>
          <select class="nrafb-provider" title="Provider"></select>
          <select class="nrafb-home-assistant" title="Home Assistant entities"></select>
          <button class="nrafb-btn nrafb-home-assistant-add" title="Add Home Assistant connection"><i class="fa fa-plus"></i></button>
          <button class="nrafb-btn nrafb-home-assistant-edit" title="Edit Home Assistant connection"><i class="fa fa-cog"></i></button>
          <button class="nrafb-btn nrafb-provider-add" title="Add new AI provider"><i class="fa fa-plus"></i></button>
          <button class="nrafb-btn nrafb-provider-edit" title="Edit selected provider"><i class="fa fa-cog"></i></button>
        </div>
        <div class="nrafb-messages"></div>
        <div class="nrafb-inputbar">
          <div class="nrafb-mode-row">
            <select class="nrafb-mode" title="AI mode">
              <option value="ask">Ask</option>
              <option value="build">Build</option>
              <option value="modify">Modify</option>
              <option value="test">Test</option>
              <option value="review">Review</option>
              <option value="document">Document</option>
            </select>
            <span class="nrafb-context-summary">Context: active tab</span>
          </div>
          <div class="nrafb-context">
            <button class="nrafb-btn nrafb-tabpicker" title="Add tab context"><i class="fa fa-folder-open"></i> <span class="nrafb-tabpicker-label">active tab</span></button>
            <button class="nrafb-btn nrafb-entitypicker" title="Choose Home Assistant entities"><i class="fa fa-list"></i> <span class="nrafb-entitypicker-label">entities</span></button>
            <button class="nrafb-btn nrafb-servicepicker" title="Choose Home Assistant services"><i class="fa fa-bolt"></i> <span class="nrafb-servicepicker-label">services</span></button>
            <button class="nrafb-btn nrafb-nodepicker" title="Choose Node-RED nodes"><i class="fa fa-sitemap"></i> <span class="nrafb-nodepicker-label">nodes</span></button>
            <button class="nrafb-btn nrafb-debug-capture" title="Capture debug node output for the AI to review (deploy first, then trigger the flow while capturing)"><i class="fa fa-bug"></i> <span class="nrafb-debug-capture-label">test capture</span></button>
            <button class="nrafb-btn nrafb-attach" title="Attach file"><i class="fa fa-paperclip"></i></button>
            <input type="file" class="nrafb-file" multiple hidden />
            <label class="nrafb-autoenable" title="New nodes from AI responses are imported disabled by default so nothing runs until you review them">
              <input type="checkbox" class="nrafb-autoenable-input" /> enable new nodes immediately
            </label>
          </div>
          <textarea class="nrafb-input" rows="3" placeholder="Ask the AI…"></textarea>
          <button class="nrafb-btn nrafb-send" title="Send (Ctrl+Enter)"><i class="fa fa-paper-plane"></i></button>
        </div>
      </div>
    `);

    RED.sidebar.addTab({
      id: "ai-flow-builder",
      name: "AI Chat",
      label: "AI Chat",
      iconClass: "fa fa-comments",
      content: $content,
      closeable: true,
      visible: true
    });

    // Load shared UI logic
    $.when(
      $.getScript("ai-flow-builder/static/flow-planner.js"),
      $.getScript("ai-flow-builder/static/message-renderer.js"),
      $.getScript("ai-flow-builder/static/apply-handlers.js"),
      $.getScript("ai-flow-builder/static/ai-chat.js")
    ).done(() => {
      if (window.NRAFB && typeof window.NRAFB.init === "function") {
        window.NRAFB.init($content);
      }
    });
  })();
</script>
